##ddc.vim and its kins

[[plugins]]
repo = 'Shougo/ddc.vim'
on_event = 'InsertEnter'
depends = ['denops.vim']
lua_source = '''

    require('config_ddc')

'''

##############################################################
#ddc ui
[[plugins]]
repo = 'Shougo/ddc-ui-native'
on_source = 'ddc.vim'

##############################################################
#matchers

##match from the top of the word
[[plugins]]
repo = 'Shougo/ddc-filter-matcher_head'
on_source = 'ddc.vim'

#remove candidates when its length is less than you input.
[[plugins]]
repo = 'Shougo/ddc-filter-matcher_length'
on_source = 'ddc.vim'

#avoid overlapping candidates
[[plugins]]
repo = 'Shougo/ddc-filter-converter_remove_overlap'
on_source = 'ddc.vim'

##############################################################
#sorters

#sort by candidates
[[plugins]]
repo = 'Shougo/ddc-filter-sorter_rank'
on_source = 'ddc.vim'

#sort by head
[[plugins]]
repo = 'Shougo/ddc-filter-sorter_head'
on_source = 'ddc.vim'

##############################################################
#sources

#to use neovim native lsp
[[plugins]]
repo = 'Shougo/ddc-source-lsp'
on_source = 'ddc.vim'

#complete with words around cursor
[[plugins]]
repo = 'Shougo/ddc-source-around'
on_source = 'ddc.vim'

#complete filename
[[plugins]]
repo = 'LumaKernel/ddc-source-file'
on_source = 'ddc.vim'


#snippet
[[plugins]]
repo = 'hrsh7th/vim-vsnip'
on_event = 'InsertEnter'
lua_add = '''
    require('config_vim-vsnip')
'''

#vsnip integration for ddc
[[plugins]]
repo = 'uga-rosa/ddc-source-vsnip'
on_source = 'ddc.vim'

#completion
[[plugins]]
repo = 'Dzzt/ddc-source-completion_alter'
on_ft = 'spectype'
depends = ['ddc.vim']

